<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusDesk</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth.js"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  
  <div class="login-wrapper">
    <div class="cd-login-panel">
      
      <div class="login-header" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
        <img src="/images/logo.png" alt="LNMIIT Logo" style="height: 48px; object-fit: contain;">
        <h1 style="margin: 0; font-size: 2.1rem;"><span class="brand-text">CampusDesk</span></h1>
        <p style="margin: 0;">Resource Booking Platform</p>
      </div>

      <div id="alert-banner" class="alert alert-danger" style="display: none;"></div>
      <div id="success-banner" class="alert alert-success" style="display: none;"></div>

      <form id="otp-request-form">
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label for="user-name">Full Name</label>
            <input type="text" id="user-name" class="form-control" placeholder="Required for first-time signups" autocomplete="name">
            <div id="name-error" class="field-error" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="user-email">LNMIIT Email</label>
            <input type="email" id="user-email" class="form-control" placeholder="e.g. username@lnmiit.ac.in" required autocomplete="email" pattern="^[a-zA-Z0-9._%+-]+@lnmiit\.ac\.in$" title="Please use your official @lnmiit.ac.in email address.">
            <div id="email-error" class="field-error" style="display: none;"></div>
          </div>
          <button type="submit" id="send-otp-btn" class="btn btn-primary" style="width: 100%;">
            Send Verification Code
          </button>
        </div>
      </form>

      <form id="otp-verify-form" style="display: none;">
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group" style="text-align: center;">
            <p style="font-size: 0.95rem; color: var(--lnm-txt-secondary); margin-bottom: 0.5rem;">
              We sent a 6-digit OTP to <strong id="display-email"></strong>
            </p>
            <label for="otp-code">6-Digit Code</label>
            <input type="text" id="otp-code" class="form-control" placeholder="000000" maxlength="6" required style="text-align: center; font-size: 1.5rem; letter-spacing: 0.3em; padding: 0.5rem;" autocomplete="one-time-code">
            <div id="otp-error" class="field-error" style="display: none;"></div>
          </div>
          
          <button type="submit" id="verify-otp-btn" class="btn btn-primary" style="width: 100%;">
            Verify & Log In
          </button>

          <div class="cooldown-text" id="cooldown-container">
            Resend OTP in <span id="cooldown-timer" class="cooldown-seconds">30</span>s
          </div>
          <button type="button" id="resend-otp-btn" class="btn btn-secondary" style="width: 100%; display: none;">
            Resend OTP
          </button>
          <button type="button" id="change-email-btn" class="btn btn-secondary" style="width: 100%; border: none; background: none; color: var(--lnm-txt-secondary); font-size: 0.85rem; padding: 0;">
            ← Change email or name
          </button>
        </div>
      </form>

    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
