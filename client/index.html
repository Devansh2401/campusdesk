<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDesk</title>
  <script>
    // Quick client-side router/redirect based on authentication state
    const token = localStorage.getItem('campusdesk_token');
    if (!token) {
      window.location.replace('/login');
    } else {
      window.location.replace('/resources');
    }
  </script>
</head>
<body style="background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
  <p>Loading CampusDesk...</p>
</body>
</html>
